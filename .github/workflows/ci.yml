jobs:
  linux-ci:
    runs-on: ubuntu-latest
    name: Linux CI (OTP ${{matrix.otp}})
    strategy:
      matrix:
        otp: ['26', '28']
    steps:
      - name: Checkout eqWAlizer
        uses: "actions/checkout@v7"
      - name: Checkout ELP
        uses: "actions/checkout@v7"
        with:
          repository: WhatsApp/erlang-language-platform
          path: elp
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install musl-tools for rust toolchain
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: musl-tools
          version: 1.0
      - name: Set up rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-musl
      - name: Install OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          install-rebar: false
          install-hex: false
      - name: Install rebar3 from OpenRiak/riak
        run: >
            wget https://github.com/OpenRiak/riak/raw/refs/heads/openriak-3.6/rebar3 &&
            chmod +x rebar3 &&
            mkdir $HOME/bin && mv rebar3 $HOME/bin &&
            echo $HOME/bin >> $GITHUB_PATH
      - name: Install sbt
        run: >
            sudo apt-get update &&
            sudo apt-get install apt-transport-https curl gnupg -yqq &&
            echo "deb https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list &&
            echo "deb https://repo.scala-sbt.org/scalasbt/debian /" | sudo tee /etc/apt/sources.list.d/sbt_old.list &&
            curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | sudo -H gpg --no-default-keyring --keyring gnupg-ring:/etc/apt/trusted.gpg.d/scalasbt-release.gpg --import &&
            sudo chmod 644 /etc/apt/trusted.gpg.d/scalasbt-release.gpg &&
            sudo apt-get update &&
            sudo apt-get install sbt
      - name: Assemble eqwalizer.jar
        run: "cd eqwalizer; sbt assembly"
      - name: Assemble eqwalizer binary
        run: "cd eqwalizer && native-image -H:IncludeResources=application.conf --no-server --no-fallback -jar target/scala-2.13/eqwalizer.jar eqwalizer"
      - name: Test elp
        working-directory: elp
        run: "cargo test --no-default-features --workspace --target x86_64-unknown-linux-musl"
      - name: Assemble elp
        working-directory: elp
        run: "cargo build --release --target x86_64-unknown-linux-musl"
      - name: Add elp to path
        run: 'echo "$GITHUB_WORKSPACE/elp/target/x86_64-unknown-linux-musl/release" >> $GITHUB_PATH'
      - name: Upload eqwalizer.jar
        uses: "actions/upload-artifact@v4"
        with:
          name: eqwalizer.jar
          path: eqwalizer/target/scala-2.13/eqwalizer.jar
name: eqWAlizer CI
on:
  push: {}
env:
  EQWALIZER_DIR: ${{ github.workspace }}/eqwalizer
  ELP_EQWALIZER_PATH: ${{ github.workspace }}/eqwalizer/eqwalizer
